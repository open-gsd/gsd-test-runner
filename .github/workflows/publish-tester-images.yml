name: Publish Tester Images

# Triggers on tagged releases. Tag format: v<major>.<minor>.<patch>
# (semver). The tag value (minus "v" prefix) becomes the image version.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish as (without v prefix, e.g. 1.4.0). Used for manual triggers.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # Node majors published as Tester Images (Slice 1 of enhancement #108).
  # Currently-supported LTS lines as of 2026-07 -- see the Node.js release
  # schedule (https://github.com/nodejs/release#release-schedule) to decide
  # when to add/drop a line. DEFAULT_NODE_MAJOR is the one that also gets
  # the plain `:latest` / un-suffixed `:<tag>` aliases.
  DEFAULT_NODE_MAJOR: "24"

jobs:
  publish-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with DEFAULT_NODE_MAJOR above; add a line here to
        # publish another major.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading "v" from tag
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing as version: ${VERSION} (tag: v${VERSION})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Linux Tester Image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: dockerfiles/linux.Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-linux:${{ steps.version.outputs.tag }}-node${{ matrix.node }}
            ${{ matrix.node == env.DEFAULT_NODE_MAJOR && format('{0}/{1}/gsd-tester-linux:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, steps.version.outputs.tag) || '' }}
            ${{ matrix.node == env.DEFAULT_NODE_MAJOR && format('{0}/{1}/gsd-tester-linux:latest', env.REGISTRY, env.IMAGE_NAMESPACE) || '' }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.tag }}
            NODE_VERSION=${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}

      - name: Verify sentinel label (multi-arch aware)
        run: |
          # buildx imagetools inspect understands multi-arch manifest lists.
          # 'docker image inspect' on a manifest index returns the index entry,
          # not a single image config -- use imagetools instead.
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-linux:${{ steps.version.outputs.tag }}-node${{ matrix.node }}"
          OUTPUT=$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Image }}')
          # Verify amd64
          LABEL=$(echo "$OUTPUT" | jq -r '."linux/amd64".config.Labels."sh.gsd-test.image-version"')
          if [[ "$LABEL" != "${{ steps.version.outputs.tag }}" ]]; then
            echo "::error::Sentinel label mismatch (amd64): expected '${{ steps.version.outputs.tag }}', got '$LABEL'"
            exit 1
          fi
          NODE_LABEL=$(echo "$OUTPUT" | jq -r '."linux/amd64".config.Labels."sh.gsd-test.node-major"')
          if [[ "$NODE_LABEL" != "${{ matrix.node }}" ]]; then
            echo "::error::Node-major label mismatch (amd64): expected '${{ matrix.node }}', got '$NODE_LABEL'"
            exit 1
          fi
          # Verify arm64
          LABEL_ARM=$(echo "$OUTPUT" | jq -r '."linux/arm64".config.Labels."sh.gsd-test.image-version"')
          if [[ "$LABEL_ARM" != "${{ steps.version.outputs.tag }}" ]]; then
            echo "::error::Sentinel label mismatch (arm64): expected '${{ steps.version.outputs.tag }}', got '$LABEL_ARM'"
            exit 1
          fi
          NODE_LABEL_ARM=$(echo "$OUTPUT" | jq -r '."linux/arm64".config.Labels."sh.gsd-test.node-major"')
          if [[ "$NODE_LABEL_ARM" != "${{ matrix.node }}" ]]; then
            echo "::error::Node-major label mismatch (arm64): expected '${{ matrix.node }}', got '$NODE_LABEL_ARM'"
            exit 1
          fi
          echo "Sentinel label OK on both amd64 + arm64: $LABEL (node-major $NODE_LABEL)"

  publish-windows:
    runs-on: windows-2022
    strategy:
      matrix:
        # Keep in sync with DEFAULT_NODE_MAJOR above; add a line here to
        # publish another major.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            # Strip leading "v" from tag
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Publishing as version: $version (tag: v$version)"

      - name: Start Docker service and wait for daemon
        shell: pwsh
        run: |
          # windows-2022 runners have Docker Engine installed but the service
          # may not be auto-started. Docker Engine on Windows Server defaults
          # to Windows containers (no mode-switch needed; Docker Desktop's
          # DockerCli.exe -SwitchDaemon doesn't exist here).
          Write-Host "Starting Docker service..."
          Start-Service -Name docker -ErrorAction Stop

          # Wait for the daemon to accept connections
          $timeout = 60
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            docker info 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Docker daemon ready after $elapsed seconds"
              docker version
              exit 0
            }
            Start-Sleep -Seconds 2
            $elapsed += 2
          }
          Write-Error "Docker daemon did not become ready within $timeout seconds"
          exit 1

      - name: Log in to GHCR
        shell: pwsh
        run: |
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $token | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Windows Tester Image
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $node = "${{ matrix.node }}"
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-windows:$tag-node$node"
          # Only the default major also gets the plain (un-suffixed) tag and
          # :latest, so existing consumers keep working.
          $images = @($image)
          if ($node -eq "${{ env.DEFAULT_NODE_MAJOR }}") {
            $images += "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-windows:$tag"
            $images += "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-windows:latest"
          }
          $tagArgs = $images | ForEach-Object { '-t', $_ }
          docker build `
            -f dockerfiles/windows.Dockerfile `
            --build-arg "IMAGE_VERSION=$tag" `
            --build-arg "NODE_VERSION=$node" `
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" `
            --label "org.opencontainers.image.revision=${{ github.sha }}" `
            --label "org.opencontainers.image.version=$tag" `
            @tagArgs .
          foreach ($i in $images) { docker push $i }

      - name: Verify sentinel label
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $node = "${{ matrix.node }}"
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-windows:$tag-node$node"
          $label = docker image inspect $image --format '{{ index .Config.Labels "sh.gsd-test.image-version" }}'
          if ($label -ne $tag) {
            Write-Host "::error::Sentinel label mismatch: expected '$tag', got '$label'"
            exit 1
          }
          $nodeLabel = docker image inspect $image --format '{{ index .Config.Labels "sh.gsd-test.node-major" }}'
          if ($nodeLabel -ne $node) {
            Write-Host "::error::Node-major label mismatch: expected '$node', got '$nodeLabel'"
            exit 1
          }
          Write-Host "Sentinel label OK: $label (node-major $nodeLabel)"

  tag-macos-alias:
    # Per ADR-0020 (amended 2026-05-24): the macOS Tester Image is a re-tagged
    # alias of the Linux image. Mac developers run it via Docker Desktop or
    # colima -- Docker on macOS provides container isolation using the Linux
    # image as content. Pure manifest operation; no rebuild.
    needs: publish-linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with DEFAULT_NODE_MAJOR above; add a line here to
        # publish another major.
        node: ["22", "24"]
    steps:
      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-tag Linux image as macOS alias
        run: |
          # Use imagetools create to duplicate the full multi-arch manifest list.
          # 'docker pull/tag/push' only copies the platform-native image and
          # silently drops the other architectures from the manifest. imagetools
          # operates on the registry index directly, preserving all platforms.
          TAG="${{ steps.version.outputs.tag }}"
          NODE="${{ matrix.node }}"
          LINUX_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-linux:$TAG-node$NODE"
          MACOS_IMAGE_VERSIONED="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos:$TAG-node$NODE"

          docker buildx imagetools create --tag "$MACOS_IMAGE_VERSIONED" "$LINUX_IMAGE"

          # Only the default major also gets the plain (un-suffixed) tag and
          # :latest, so existing consumers keep working.
          if [[ "$NODE" == "${{ env.DEFAULT_NODE_MAJOR }}" ]]; then
            MACOS_IMAGE_PLAIN="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos:$TAG"
            MACOS_IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos:latest"
            docker buildx imagetools create --tag "$MACOS_IMAGE_PLAIN" "$LINUX_IMAGE"
            docker buildx imagetools create --tag "$MACOS_IMAGE_LATEST" "$LINUX_IMAGE"
          fi

      - name: Verify sentinel label on alias (multi-arch aware)
        run: |
          # The macOS alias is a re-tag of the multi-arch Linux manifest list.
          # buildx imagetools inspect works on multi-arch manifests; docker image
          # inspect would return the index entry rather than a platform image config.
          TAG="${{ steps.version.outputs.tag }}"
          NODE="${{ matrix.node }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos:$TAG-node$NODE"
          OUTPUT=$(docker buildx imagetools inspect "$IMAGE" --format '{{ json .Image }}')
          LABEL=$(echo "$OUTPUT" | jq -r '."linux/amd64".config.Labels."sh.gsd-test.image-version"')
          if [[ "$LABEL" != "$TAG" ]]; then
            echo "::error::Sentinel label mismatch on macOS alias (amd64): expected '$TAG', got '$LABEL'"
            exit 1
          fi
          NODE_LABEL=$(echo "$OUTPUT" | jq -r '."linux/amd64".config.Labels."sh.gsd-test.node-major"')
          if [[ "$NODE_LABEL" != "$NODE" ]]; then
            echo "::error::Node-major label mismatch on macOS alias (amd64): expected '$NODE', got '$NODE_LABEL'"
            exit 1
          fi
          echo "Sentinel label OK on macOS alias: $LABEL (node-major $NODE_LABEL)"

  publish-macos-tart:
    # Real macOS-native Tart image (ADR-0030 Phase 4, issue #134) -- the
    # opt-in RuntimeTart path, additive alongside tag-macos-alias (which
    # remains the default macOS path per ADR-0030 Decision 2). This job does
    # NOT alias the Linux image; it builds a genuine macOS guest image via
    # Packer + the cirruslabs/tart plugin (dockerfiles/macos-tart.pkr.hcl).
    #
    # runs-on targets a SELF-HOSTED runner, not macos-26, because whether
    # GitHub-hosted macOS runners expose the nested-virtualization CPU
    # features Tart's Virtualization.framework usage needs is NOT confirmed
    # (ADR-0030 research). Real-world Tart CI setups found in research
    # (Cirrus Runners, Cirrus Labs' own templates) are self-hosted Mac
    # fleets. This project's Bench model is already "the developer's own Mac
    # hardware" (ADR-0007), so self-hosted matches existing philosophy too.
    runs-on: [self-hosted, macos, tart]
    strategy:
      matrix:
        # Keep in sync with DEFAULT_NODE_MAJOR above; add a line here to
        # publish another major.
        node: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading "v" from tag
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing as version: ${VERSION} (tag: v${VERSION})"

      - name: Ensure packer + tart are available
        run: |
          # Self-hosted runner may already have these from a prior run --
          # idempotent, house-style check (mirrors INSTALL_GSD_TEST.sh's
          # `command -v jq` pattern) rather than a bare `brew install` that
          # would just no-op-but-still-cost-time on every run anyway.
          if ! command -v packer >/dev/null 2>&1; then
            # Packer was pulled from homebrew-core (BUSL license change) and
            # now lives only in HashiCorp's own tap; `brew install packer`
            # 404s with "No available formula" as of Homebrew's post-removal
            # index. `brew install hashicorp/tap/packer` auto-taps and
            # installs in one step -- confirmed working against a real
            # runner (studio-mac-mini.local, 2026-09-07).
            brew install hashicorp/tap/packer
          fi
          if ! command -v tart >/dev/null 2>&1; then
            brew install cirruslabs/cli/tart
          fi
          if ! command -v sshpass >/dev/null 2>&1; then
            brew install cirruslabs/cli/sshpass
          fi
          packer version
          tart --version
          sshpass -V

      - name: Log in to GHCR (Tart)
        run: |
          # CONFIRMED (studio-mac-mini.local, 2026-09-07, real `tart login
          # --help`): there is no `-u` shorthand for --username -- passing
          # -u left --username unset, so both --username and --password-stdin
          # were reported missing even though a value followed -u on the
          # command line.
          echo "${{ secrets.GITHUB_TOKEN }}" | tart login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: packer init
        run: packer init dockerfiles/macos-tart.pkr.hcl

      - name: packer build
        run: |
          packer build \
            -var "node_version=${{ matrix.node }}" \
            -var "image_version=${{ steps.version.outputs.tag }}" \
            dockerfiles/macos-tart.pkr.hcl

      - name: Push macOS Tart Tester Image
        id: push
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          NODE="${{ matrix.node }}"
          # Matches dockerfiles/macos-tart.pkr.hcl's vm_name template.
          LOCAL_VM="gsd-tester-macos-tart-node${NODE}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos-tart:${TAG}-node${NODE}"

          tart push "$LOCAL_VM" "$IMAGE" \
            --label "sh.gsd-test.image-version=${TAG}" \
            --label "sh.gsd-test.node-major=${NODE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          # Only the default major also gets the plain (un-suffixed) tag and
          # :latest, matching the existing publish-linux/publish-windows
          # conditional-tag pattern.
          if [[ "$NODE" == "${{ env.DEFAULT_NODE_MAJOR }}" ]]; then
            IMAGE_PLAIN="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos-tart:${TAG}"
            IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gsd-tester-macos-tart:latest"
            tart push "$LOCAL_VM" "$IMAGE_PLAIN" \
              --label "sh.gsd-test.image-version=${TAG}" \
              --label "sh.gsd-test.node-major=${NODE}"
            tart push "$LOCAL_VM" "$IMAGE_LATEST" \
              --label "sh.gsd-test.image-version=${TAG}" \
              --label "sh.gsd-test.node-major=${NODE}"
          fi

      - name: Verify sentinel file (boot pushed image, cat the sentinel)
        run: |
          # No confirmed Tart equivalent of `docker image inspect` for
          # reading labels back off a pulled image (ADR-0030 Decision 3), so
          # verification instead boots a fresh instance of the just-pushed
          # image and reads the in-guest sentinel file baked by
          # dockerfiles/macos-tart-provision.sh -- same fail-loud spirit as
          # the Docker jobs' label-inspect steps, adapted to Tart's actual
          # read mechanism (SSH, ADR-0030 Decision 4). `tart exec` via the
          # Tart Guest Agent was tried first and found to fail unreliably
          # and silently (exit 125, empty output) against a real, freshly
          # booted headless Cirrus Labs guest, even with the Guest Agent
          # confirmed running -- so this uses SSH with Cirrus Labs' own
          # documented default admin/admin guest credentials instead,
          # matching the two-hop pattern internal/tartexec.Exec implements.
          TAG="${{ steps.version.outputs.tag }}"
          NODE="${{ matrix.node }}"
          IMAGE="${{ steps.push.outputs.image }}"
          VERIFY_VM="gsd-tester-macos-tart-verify-node${NODE}"

          tart clone "$IMAGE" "$VERIFY_VM"
          tart run "$VERIFY_VM" --no-graphics &
          RUN_PID=$!

          GUEST_IP=$(tart ip "$VERIFY_VM" --wait 90)
          if [[ -z "$GUEST_IP" ]]; then
            echo "::error::Failed to resolve guest IP for $VERIFY_VM within 90s"
            tart stop "$VERIFY_VM" || true
            kill "$RUN_PID" 2>/dev/null || true
            tart delete "$VERIFY_VM" || true
            exit 1
          fi

          SSH_OPTS=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)

          # sshd needs a few seconds after IP resolution before it actually
          # accepts connections -- poll for readiness the same way the old
          # tart-exec loop did, just over SSH instead.
          for i in $(seq 1 30); do
            if sshpass -p admin ssh "${SSH_OPTS[@]}" admin@"$GUEST_IP" -- true >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          SENTINEL=$(sshpass -p admin ssh "${SSH_OPTS[@]}" admin@"$GUEST_IP" -- cat /opt/gsd-test/image-version)
          STATUS=0
          if [[ "$SENTINEL" != "$TAG" ]]; then
            echo "::error::Sentinel file mismatch: expected '$TAG', got '$SENTINEL'"
            STATUS=1
          else
            echo "Sentinel file OK: $SENTINEL (node-major $NODE)"
          fi

          tart stop "$VERIFY_VM" || true
          kill "$RUN_PID" 2>/dev/null || true
          tart delete "$VERIFY_VM" || true

          exit $STATUS
